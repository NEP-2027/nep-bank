.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pin{display:flex;gap:8px;margin-top:10px}
.pin input{font:600 22px/1 Oswald,sans-serif;letter-spacing:.3em;text-align:center;max-width:160px}

.ov{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle,rgba(10,16,14,.62),rgba(10,16,14,.18) 72%);animation:ovin .25s ease-out,ovout .4s ease-in 1.9s forwards}
@keyframes ovin{from{opacity:0}}
@keyframes ovout{to{opacity:0}}
.ov .lab{position:relative;z-index:2;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center}
.ov .ovbig{font:700 54px/1 Oswald,sans-serif;font-variant-numeric:tabular-nums;animation:pop .55s cubic-bezier(.2,1.6,.4,1) .15s both}
.ov .ovbig.in{color:#8BEBA6}.ov .ovbig.out{color:#FF9A88}.ov .ovbig.sm{font-size:40px}
.ov .sub{font:500 18px/1.3 Oswald,sans-serif;letter-spacing:.02em;margin-top:10px;max-width:84vw;animation:pop .5s ease-out .3s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.coin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFEDB0,#E0A526 55%,#9A6A10);border:2px solid #6B4A0A;display:grid;place-items:center;font:700 21px/1 Oswald,sans-serif;color:#6B4A0A;box-shadow:0 3px 0 #6B4A0A}
.coin.usd{background:radial-gradient(circle at 35% 30%,#DDF7CF,#5DB57F 55%,#2E6B45);border-color:#1F4A2F;color:#1F4A2F;box-shadow:0 3px 0 #1F4A2F}
.ov.out .coin{animation:cout 1.4s cubic-bezier(.3,.6,.4,1) var(--d) both}
.ov.in .coin{animation:cin 1.3s cubic-bezier(.5,0,.6,1.3) var(--d) both}
@keyframes cout{0%{transform:scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(var(--x),-62vh) rotate(var(--r));opacity:0}}
@keyframes cin{0%{transform:translate(var(--x),-62vh) rotate(var(--r));opacity:0}20%{opacity:1}80%{transform:translate(calc(var(--x) * .12),0);opacity:1}100%{transform:scale(.4);opacity:0}}
.ov.fx .coin{width:72px;height:72px;margin:-36px;font-size:34px;top:40%}
.ov.fx .coin.a{animation:sw 1.4s ease-in-out .1s both}
.ov.fx .coin.b{animation:sw2 1.4s ease-in-out .1s both}
@keyframes sw{0%{transform:translate(-90px,0)}50%{transform:translate(0,-80px) scale(1.25)}100%{transform:translate(90px,0)}}
@keyframes sw2{0%{transform:translate(90px,0)}50%{transform:translate(0,80px) scale(1.25)}100%{transform:translate(-90px,0)}}
.ov.fx .lab{margin-top:42vh}
.ov .dbox{display:flex;gap:12px;margin-bottom:18px}
.ov .dbox .die{--ds:66px;animation:tumble .95s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes tumble{0%{transform:translateY(-55vh) rotate(-540deg)}70%{transform:translateY(10px) rotate(12deg)}100%{transform:none}}
.ov .ccov{width:min(80vw,330px);min-height:170px;background:#FFF9EC;color:#2A221C;border:3px solid #2A221C;border-radius:10px;box-shadow:0 8px 0 #2A221C;padding:20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-shadow:none;animation:flip .75s ease-out both}
.ov .ccov b{font:700 15px/1 Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#C8372D}
.ov .ccov span{font:600 23px/1.2 Oswald,sans-serif}
@keyframes flip{0%{transform:perspective(700px) rotateY(100deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ov.rate .ovbig:nth-child(2){animation-delay:.35s}
@media (prefers-reduced-motion:reduce){.ov,.ov *{animation-duration:.01s!important;animation-delay:0s!important}.ov .coin{display:none}}
.tkl li{flex-wrap:wrap;align-items:center}
.tkl .tx{flex:1;min-width:60%}
.rx{display:flex;gap:4px;margin-left:auto}
.rxb{appearance:none;border:1px solid rgba(244,236,216,.3);background:transparent;color:var(--on-table);border-radius:999px;padding:3px 7px;font-size:13px;cursor:pointer;min-height:28px}
.rxb.on{background:rgba(215,154,43,.35);border-color:var(--gold)}
.offer{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--surface));border-radius:4px;padding:12px;margin-top:10px}
.offer b{font:600 17px/1.2 Oswald,sans-serif}
.ver{font:500 11px/1 Oswald,sans-serif;opacity:.7;margin-left:6px}

/* ===== Android (Material 3) theme ===== */
:root{--m-primary:#6750A4;--m-on-primary:#FFFFFF;--m-primary-c:#EADDFF;--m-on-primary-c:#21005D;--m-sec-c:#E8DEF8;--m-on-sec-c:#1D192B;--m-error:#B3261E;--m-success:#146C2E;
  --m-surface:#FEF7FF;--m-scl0:#FFFFFF;--m-scl:#F7F2FA;--m-sc:#F3EDF7;--m-sch:#ECE6F0;--m-schh:#E6E0E9;--m-on-surface:#1D1B20;--m-osv:#49454F;--m-outline:#79747E;--m-outline-v:#CAC4D0;--m-inv:#322F35;--m-inv-on:#F5EFF7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--m-primary:#D0BCFF;--m-on-primary:#381E72;--m-primary-c:#4F378B;--m-on-primary-c:#EADDFF;--m-sec-c:#4A4458;--m-on-sec-c:#E8DEF8;--m-error:#F2B8B5;--m-success:#7BDA8F;
  --m-surface:#141218;--m-scl0:#0F0D13;--m-scl:#1D1B20;--m-sc:#211F26;--m-sch:#2B2930;--m-schh:#36343B;--m-on-surface:#E6E0E9;--m-osv:#CAC4D0;--m-outline:#938F99;--m-outline-v:#49454F;--m-inv:#E6E0E9;--m-inv-on:#322F35}}
:root[data-theme="dark"]{--m-primary:#D0BCFF;--m-on-primary:#381E72;--m-primary-c:#4F378B;--m-on-primary-c:#EADDFF;--m-sec-c:#4A4458;--m-on-sec-c:#E8DEF8;--m-error:#F2B8B5;--m-success:#7BDA8F;
  --m-surface:#141218;--m-scl0:#0F0D13;--m-scl:#1D1B20;--m-sc:#211F26;--m-sch:#2B2930;--m-schh:#36343B;--m-on-surface:#E6E0E9;--m-osv:#CAC4D0;--m-outline:#938F99;--m-outline-v:#49454F;--m-inv:#E6E0E9;--m-inv-on:#322F35}
.ms{display:none;font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;width:24px;overflow:hidden}
body.m3{--table:var(--m-surface);--table2:var(--m-sc);--paper:var(--m-scl);--surface:var(--m-scl0);--ink:var(--m-on-surface);--on-ink:var(--m-surface);--muted:var(--m-osv);--line:var(--m-outline-v);--red:var(--m-primary);--green:var(--m-success);--gold:var(--m-primary);--on-table:var(--m-on-surface);
  background-image:none;font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.25px}
body.m3 *{font-family:inherit}
body.m3 .ms{display:inline-block;font-family:'Material Symbols Outlined'}
body.m3 .rt{display:none}
body.m3 header{padding:14px 16px 8px}
body.m3 .logo{font:400 22px/1.2 Roboto,sans-serif;color:var(--m-on-surface);text-shadow:none;letter-spacing:0}
body.m3 .logo small{font:500 12px/1.3 Roboto,sans-serif;color:var(--m-osv);letter-spacing:.4px;opacity:1;margin-top:2px}

body.m3 .tname,body.m3 .mechip{border:1px solid var(--m-outline-v);border-radius:8px;color:var(--m-on-surface);font:500 14px/1 Roboto,sans-serif;letter-spacing:.1px;padding:8px 12px;min-height:32px}
body.m3 .sync{color:var(--m-osv);opacity:1}

@keyframes flash3{0%{background:var(--m-primary-c)}100%{background:var(--m-sec-c)}}
body.m3 .tkl{background:var(--m-sc);color:var(--m-on-surface);border-radius:12px}

body.m3 .sheet{background:var(--m-scl);border-radius:16px;box-shadow:none;padding:16px;margin-bottom:12px}

body.m3 h3{font:500 16px/1.5 Roboto,sans-serif;letter-spacing:.15px}
body.m3 .lbl{text-transform:none;font:500 14px/1.4 Roboto,sans-serif;letter-spacing:.1px;color:var(--m-osv);margin:14px 0 8px}

body.m3 .btn{border:0;border-radius:20px;min-height:40px;padding:10px 24px;font:500 14px/1.4 Roboto,sans-serif;letter-spacing:.1px;box-shadow:none;background:var(--m-sec-c);color:var(--m-on-sec-c)}

body.m3 input,body.m3 select,body.m3 textarea{border:1px solid var(--m-outline);border-radius:4px;background:transparent;color:var(--m-on-surface);font-family:Roboto,sans-serif;letter-spacing:.5px}
body.m3 input:focus,body.m3 select:focus,body.m3 textarea:focus{outline:none;border-color:var(--m-primary);box-shadow:inset 0 0 0 1px var(--m-primary)}

body.m3 .chip{border-radius:8px;border:1px solid var(--m-outline);background:transparent;color:var(--m-osv);font:500 14px/1 Roboto,sans-serif;letter-spacing:.1px;min-height:32px;padding:6px 14px}

body.m3 .pchip{border-radius:8px;border:1px solid var(--m-outline);background:transparent;color:var(--m-on-surface);font:500 14px/1 Roboto,sans-serif;letter-spacing:.1px;min-height:40px;padding:4px 14px 4px 4px}
body.m3 .pchip.on{background:var(--m-sec-c);border-color:transparent;color:var(--m-on-sec-c)}
body.m3 .spr{aspect-ratio:1;border-radius:50%;background:var(--m-primary-c);padding:0;display:inline-grid;place-items:center;vertical-align:middle}
body.m3 .spr svg{width:60%;height:80%}
body.m3 .mechip .spr{width:24px}
body.m3 .prow{grid-template-columns:40px minmax(0,1fr) auto auto}
body.m3 .prow .spr{width:40px}
body.m3 .pchip .spr{width:30px}
body.m3 .bankico{width:30px;height:30px;background:var(--m-primary);color:var(--m-on-primary);font:500 15px/1 Roboto,sans-serif}
body.m3 .seg{border:1px solid var(--m-outline);border-radius:20px;overflow:hidden}
body.m3 .seg button{background:transparent;color:var(--m-on-surface);font:500 14px/1.2 Roboto,sans-serif;letter-spacing:.1px;min-height:40px}
body.m3 .seg button+button{border-left:1px solid var(--m-outline)}

body.m3 .wallet{grid-template-columns:auto 1fr;gap:2px 16px}

body.m3 .neg{color:var(--m-error)!important}
body.m3 .rate div{border:0;border-radius:12px;background:var(--m-sch)}
body.m3 .rate span{color:var(--m-osv);font-size:12px}

/* ===== v2 ===== */
.pcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:10px}

.pc{--k:#1A1A1A;width:100%;max-width:100%;aspect-ratio:2/3;container-type:inline-size;position:relative;display:flex;flex-direction:column;background:var(--c);border:1px solid #666666;overflow:hidden;font-family:'Bahnschrift','Barlow Condensed','Arial Narrow',sans-serif;font-stretch:condensed;color:var(--k);letter-spacing:0;text-transform:none}

function localStore(){

    async createTable(meta){const d=load(),id='t'+Date.now().toString(36);d[id]={meta,ev:[]};save(d);emit();return id},
    async updateTable(id,patch){const d=load();if(!d[id])return;Object.assign(d[id].meta,patch);save(d);emit()},
    watchTable(id,cb){const f=()=>{const t=load()[id];cb(t?Object.assign({id},t.meta):null,null)};subs.add(f);f();return()=>subs.delete(f)},
    watchEv(id,since,cb){const f=()=>{const t=load()[id];cb(t?t.ev.filter(e=>e.ts>(since||0)):[],null)};subs.add(f);f();return()=>subs.delete(f)},
    async addEv(id,ev){const d=load();if(!d[id])return;d[id].ev.push(Object.assign({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)},ev));save(d);emit()},
    watchPresets(cb){const f=()=>cb(lget('nepbank2.presets',[]));subs.add(f);f();return()=>subs.delete(f)},
    async addPreset(pr){const l=lget('nepbank2.presets',[]);l.unshift(Object.assign({id:'pr'+Date.now().toString(36)},pr));lset('nepbank2.presets',l.slice(0,30));emit()},

async function fbStore(){
  firebase.initializeApp(window.FB_CONFIG);
  const fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true})}catch(_){}
  try{await fs.enablePersistence({synchronizeTabs:true})}catch(_){}
  await firebase.auth().signInAnonymously();
  const race=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r('__timeout'),ms))]);
  return {kind:'fb',
    watchTables(cb,err){const subs={},data={};let ready=false;
      const emit=meta=>cb(Object.values(data).sort((a,b)=>b.created-a.created),meta||{fromCache:false});
      const sync=()=>{const ids=lget('nepbank2.my',[]);Object.keys(subs).forEach(id=>{if(!ids.includes(id)){subs[id]();delete subs[id];delete data[id]}});
        ids.forEach(id=>{if(!subs[id])subs[id]=fs.doc('tables/'+id).onSnapshot(d=>{if(d.exists)data[id]=Object.assign({id},d.data());else delete data[id];emit(d.metadata)},()=>{})});
        if(!ids.length||ready)emit(null);ready=true};
      window.addEventListener('nepmy',sync);sync();return()=>{window.removeEventListener('nepmy',sync);Object.values(subs).forEach(f=>f())}},
    async createTable(meta){for(let i=0;i<8;i++){const c=String(1000+rint(9000));const q=await fs.collection('tables').where('code','==',c).limit(1).get();if(q.empty){meta.code=c;break}}
      const ref=fs.collection('tables').doc();await ref.set(meta);addMy(ref.id);return ref.id},
    updateTable(id,patch){return race(fs.doc('tables/'+id).update(patch),2500)},
    watchTable(id,cb,err){return fs.doc('tables/'+id).onSnapshot(d=>cb(d.exists?Object.assign({id:d.id},d.data()):null,d.metadata),err)},
    watchEv(id,since,cb,err){return fs.collection('tables/'+id+'/ev').where('ts','>',since||0).orderBy('ts').limit(1000).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),err)},
    async addEv(id,ev){const r=await race(fs.collection('tables/'+id+'/ev').add(ev),1500);if(r==='__timeout')toast('Нет связи — операция отправится, когда появится интернет.')},
    watchPresets(cb,err){return fs.collection('presets').orderBy('created','desc').limit(30).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),err)},
    async addPreset(pr){await race(fs.collection('presets').add(pr),2500)},
    async findCode(c){const q=await fs.collection('tables').where('code','==',c).limit(1).get();return q.empty?null:q.docs[0].id},
    async lease(id){try{const ref=fs.doc('tables/'+id+'/sys/compact');const r=await race(fs.runTransaction(async t=>{const d=await t.get(ref),x=d.exists?d.data():null;if(x&&x.until>Date.now()&&x.holder!==CID)return false;t.set(ref,{holder:CID,until:Date.now()+20000});return true}),4000);return r===true}catch(_){return false}}};
}
function dbStore(db){

    async createTable(meta){const ref=db.collection('tables').doc();await ref.set(meta);return ref.id},
    updateTable(id,patch){chain=chain.catch(()=>{}).then(()=>db.doc('tables/'+id).update(patch));return chain},
    watchTable(id,cb,err){return db.doc('tables/'+id).onSnapshot(d=>cb(d.exists?Object.assign({id:d.id},d.data()):null,d.metadata),err)},
    watchEv(id,since,cb,err){return db.collection('tables/'+id+'/ev').where('ts','>',since||0).orderBy('ts').limit(1000).onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),err)},
    async addEv(id,ev){await db.collection('tables/'+id+'/ev').add(ev)},
    watchPresets(cb,err){return db.collection('presets').orderBy('created','desc').limit(30).onSnapshot(s=>cb(s.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()))),err)},
    async addPreset(pr){await db.collection('presets').add(pr)},
    async lease(id){try{const r=await db.doc('tables/'+id+'/sys/compact').acquire({holder:CID,ttlMs:20000});return !!r.acquired}catch(_){return false}}};
}

const animQ=[];let animOn=false;
const reduceMo=matchMedia('(prefers-reduced-motion: reduce)').matches;
function playAnim(o){animQ.push(o);if(animQ.length>4)animQ.splice(0,animQ.length-4);if(!animOn)nextAnim()}
function nextAnim(){const o=animQ.shift();if(!o){animOn=false;return}animOn=true;if(o.type==='in'||o.type==='out')feedback(o.type);

  if(e.pid===me&&['buy','build','share'].includes(e.kind)){const c=e.cell?cellById(e.cell):null,amt=e.kind==='buy'?e.price:e.kind==='build'?e.cost:e.price;playAnim({type:'out',amount:amt,sub:e.kind==='buy'?`Патент «${c?c.name:''}»`:e.kind==='build'?`Постройка в «${c?c.name:''}»`:`Акция «${(GRP(e.group)||{name:''}).name}»`});return}

  if(e.kind==='loan'&&e.pid===me){playAnim({type:'in',amount:e.amount,sub:`Ссуда от банка, вернуть ${rub(e.total)}`});return}

    return}

    case 'rentsel':{rentSel=v;render();setTimeout(()=>{const r=$('#rentcard');if(r)r.scrollIntoView({behavior:reduceMo?'auto':'smooth',block:'start'})},30);return}

    case 'rentpay':{const st=state(),c=cellById(v),o=st.own[v];if(!c||!o){toast('У этого поля нет владельца.');break}if(o.pid===me)break;const rn=rentNow(st,c);if(await addEv({kind:'pay',from:me,to:o.pid,amount:rn.amount,note:`Рента «${c.name}»: ${rn.label}`,rent:v,pid:me})){rentSel=null;patQ=''}break}

    case 'taxpay':{const t=taxCalc(state(),me);await addEv({kind:'pay',from:me,to:'bank',amount:t.total,note:`Налог: ${S().taxBase} + ${S().taxPct}% от вложений ${t.inv.total}`,tax:true,pid:me});break}
    case 'dpat':{dealB=dealB||blankDeal();const l=dealB[b.dataset.side].patents,i=l.indexOf(v);if(i<0)l.push(v);else l.splice(i,1);break}
    case 'dloan':{dealB=dealB||blankDeal();const l=dealB[b.dataset.side].loans,i=l.indexOf(v);if(i<0)l.push(v);else l.splice(i,1);break}
    case 'dsh':{dealB=dealB||blankDeal();const sh=dealB[b.dataset.side].shares,g=b.dataset.g;sh[g]=Math.max(0,(+sh[g]||0)+(+v));if(!sh[g])delete sh[g];break}
    case 'dealsend':{const to=sel.dealTo;if(!to){toast('Выберите, с кем сделка.');return}const d=dealB||blankDeal(),clean=x=>({patents:x.patents.slice(),shares:Object.fromEntries(Object.entries(x.shares).filter(([,n])=>+n>0)),loans:x.loans.slice(),rub:+x.rub||0,usd:+x.usd||0}),give=clean(d.give),take=clean(d.take);
      if(!sideText(give)&&!sideText(take)){toast('Добавьте в сделку хотя бы что-нибудь.');return}

    case 'dacc':{const st=state(),o=st.offers[v];if(!o)break;if(!sideOk(st,o.pid,o.give)||!sideOk(st,o.to,o.take)){toast('Сделка уже невозможна: части имущества нет у участников.');break}await addEv({kind:'dealOk',of:v,pid:me});break}
    case 'saveecon':{const s0=setDraft||S(),s1={};for(const k of Object.keys(DEFSET))s1[k]=k==='fxMode'?s0.fxMode:BOOLSET.has(k)?!!s0[k]:Math.max(0,+String(s0[k]).replace(',','.')||0);
      const patch={settings:s1};if(sprDraft)patch.sharePrices=Object.fromEntries(Object.entries(sprDraft).map(([g,v])=>[g,Math.max(0,+v||0)]));
      try{await store.updateTable(tid,patch);setDraft=null;sprDraft=null;toast('Правила сохранены.')}catch(_){toast('Не удалось сохранить правила.')}break}

    case 'theme':lset('nepbank2.theme',v);document.body.classList.toggle('m3',v==='m3');tkKey='';break;
    case 'react':{if(!me){toast('Выберите себя за столом, чтобы реагировать.');return}if(evs.some(r=>r.kind==='react'&&r.of===v&&r.emoji===b.dataset.e&&r.pid===me))return;addEv({kind:'react',of:v,emoji:b.dataset.e,pid:me});return}
    case 'ddir':deal.dir=v;break;
    case 'offer':{const amt=+deal.amount||0;if(!sel.dealTo){toast('Выберите, с кем сделка.');return}if(amt<=0){toast('Введите сумму сделки.');return}if(await addEv({kind:'offer',pid:me,to:sel.dealTo,dir:deal.dir,amount:amt,text:deal.text.trim().slice(0,80)})){toast('Предложение отправлено.');deal={dir:deal.dir,amount:'',text:''};sel.dealTo=null}break}
    case 'odec':await addEv({kind:'offerResp',of:v,ok:false,pid:me});break;
    case 'ocan':await addEv({kind:'offerResp',of:v,ok:false,cancel:true,pid:me});break;
    case 'lrounds':loan.rounds=+v;break;
    case 'loan':{const s=S(),amt=+loan.amount||0;if(amt<=0){toast('Введите сумму ссуды.');return}const total=Math.round(amt*(1+(+s.loanRate||0)/100));if(await addEv({kind:'loan',pid:me,amount:amt,total,rounds:loan.rounds,per:Math.ceil(total/loan.rounds)})){loan={amount:'',rounds:loan.rounds}}break}
    case 'loanpay':{const L=activeLoans(me).find(x=>x.id===v);if(L)await addEv({kind:'pay',from:me,to:'bank',amount:L.left,note:'Ссуда: досрочное погашение',loanId:L.id,pid:me});break}
    case 'rk':roul.k=+v;roul.res=null;break;
    case 'roul':{if(roulSpin)return;const bet=+roul.bet||0;if(bet<=0){toast('Введите ставку.');return}const k=roul.k,win=rint(2)===0,amt=win?bet*k:bet;
      const segs=[...Array(16).keys()].filter(i=>(i%2===0)===win),idx=segs[rint(segs.length)],target=360-(idx*22.5+11.25);
      roulRot=roulRot+360*5+((target-(roulRot%360))+360)%360;roul.res=null;
      const finish=async()=>{roulSpin=false;if(await addEv(win?{kind:'pay',from:'bank',to:me,amount:amt,note:`Рулетка 1:${k}: выигрыш, ставка ${bet}`,pid:me}:{kind:'pay',from:me,to:'bank',amount:amt,note:`Рулетка 1:${k}: проигрыш, ставка ${bet}`,pid:me}))roul.res={win,amt};render()};
      const wh=$('#rwh');if(!wh||reduceMo){finish();return}
      roulSpin=true;b.disabled=true;wh.style.transition='transform 2.4s cubic-bezier(.15,.7,.2,1)';requestAnimationFrame(()=>{wh.style.transform=`rotate(${roulRot}deg)`});setTimeout(finish,2550);return}
    case 'announce':{const rows=finalRows();await addEv({kind:'final',pid:me||'',rank:rows.map(r=>({id:r.p.id,cap:Math.round(r.cap)}))});toast('Итоги объявлены всем игрокам.');break}
    case 'savepreset':{const name=(presetName||'').trim();if(!name){toast('Введите название набора.');return}try{await store.addPreset({name:name.slice(0,40),created:Date.now(),settings:S(),rates:rates(),chance:table.chance||[],sharePrices:table.sharePrices||null});presetName='';toast(`Набор «${name}» сохранён.`)}catch(_){toast('Не удалось сохранить набор.')}break}
    case 'export':{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
      const q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[['Время','Событие','Отменено']].concat(evs.filter(e=>e.kind!=='react'&&e.kind!=='join'&&e.kind!=='claim'&&e.kind!=='emo').map(e=>[new Date(e.ts).toLocaleString('ru-RU'),describe(e),ledger().und.has(e.id)?'да':'']));
      const name=(table.name||'стол').replace(/[^\wа-яё\- ]/gi,'').trim()||'стол';
      const fname=`${name} — история.csv`,payload='\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');if(!dl){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([payload],{type:'text/csv;charset=utf-8'}));a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return}try{await dl.save({filename:fname,data:payload})}catch(err){if(!err||err.code!=='declined')toast('Не удалось скачать историю.')}return}
    case 'goc':tab='bank';bsub=v;window.scrollTo(0,0);break;
    case 'radd':ratesDraft=ratesDraft||rates().map(x=>({buy:x.buy,sell:x.sell,w:x.w}));ratesDraft.push({buy:50,sell:46,w:1});break;
    case 'rdel':ratesDraft=ratesDraft||rates().map(x=>({buy:x.buy,sell:x.sell,w:x.w}));ratesDraft.splice(+v,1);break;
    case 'rreset':ratesDraft=null;break;
    case 'rsave':{const d=ratesDraft.map(x=>({buy:Math.max(1,+x.buy||0),sell:Math.max(1,+x.sell||0),w:Math.max(0,+x.w||0)}));if(!d.length){toast('Нужен хотя бы один курс.');return}
      try{await store.updateTable(tid,{rates:d});ratesDraft=null;toast('Курсы сохранены — они уже у всех игроков.')}catch(_){toast('Не удалось сохранить курсы.')}break}
    case 'fxside':fxSide=v;fxRub=fxUsd?String((+fxUsd)*(v==='buy'?buyPrice():sellPrice())):'';break;
    case 'fx':{const u=parseInt(fxUsd)||0,price=fxSide==='buy'?buyPrice():sellPrice();if(u<=0||fxOpenLeft()<=0)return;
      if(await addEv({kind:'fx',pid:me,side:fxSide,usd:u,rub:u*price,price})){toast(fxSide==='buy'?`Куплено ${usd(u)} за ${rub(u*price)}`:`Продано ${usd(u)}, получено ${rub(u*price)}`);fxUsd='';fxRub=''}break}
    case 'unlock':{const p=($('#pin')||{}).value||'';if(p===String(table.pin)){bankOpen=true}else{toast('Неверный PIN.');return}break}
    case 'hf':hFilter=v;break;
    case 'hw':hWho=v;break;
    case 'sundo':case 'undo':{const ev=evs.find(x=>x.id===v);if(ev)await addEv({kind:'undo',of:ev.id,pid:me||''});break}
    case 'savenames':{if(!namesDraft&&!charsDraft)return;const names=(namesDraft||players().map(p=>p.name)).map((n,i)=>(n||'').trim()||'Игрок '+(i+1));if(new Set(names.map(n=>n.toLowerCase())).size!==names.length){toast('Имена повторяются.');return}
      try{await store.updateTable(tid,{players:players().map((p,i)=>Object.assign({},p,{name:names[i].slice(0,24),ch:charsDraft?charsDraft[i]:p.ch}))});namesDraft=null;charsDraft=null;toast('Игроки сохранены.')}catch(_){toast('Не удалось сохранить.')}break}
    case 'saveset':{if(!setDraft)return;const s={};for(const k of Object.keys(DEFSET))s[k]=k==='fxMode'?setDraft.fxMode:BOOLSET.has(k)?!!setDraft[k]:Math.max(0,+String(setDraft[k]).replace(',','.')||0);
      if(s.rateMin>s.rateMax){toast('Нижняя граница курса больше верхней.');return}
      try{await store.updateTable(tid,{settings:s});setDraft=null;toast('Настройки сохранены.')}catch(_){toast('Не удалось сохранить.')}break}
    case 'dadd':{deckDraft=deckDraft||(table.chance||[]).map(c=>({text:c.text,w:+c.w||0}));if(deckDraft.length>=50){toast('В колоде максимум 50 карточек.');return}deckDraft.push({text:'',w:1});render();const t=$(`[data-dk="${deckDraft.length-1}"]`);if(t){t.scrollIntoView({block:'center',behavior:'smooth'});t.focus()}return}
    case 'ddel':deckDraft=deckDraft||(table.chance||[]).map(c=>({text:c.text,w:+c.w||0}));deckDraft.splice(+v,1);break;
    case 'dreset':deckDraft=null;break;
    case 'dsave':{const d=deckDraft.map(c=>({text:String(c.text||'').trim().slice(0,200),w:Math.max(0,+c.w||0)})).filter(c=>c.text);
      try{await store.updateTable(tid,{chance:d});deckDraft=null;toast('Колода сохранена — она уже у всех игроков.')}catch(_){toast('Не удалось сохранить колоду.')}break}
  }
  render();
});
